name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python -m pip install -r workers/requirements-sqruff.txt pytest
      - run: python -m pytest -q
      - name: Install the Neovim and Dadbod compatibility baseline
        run: |
          curl --fail --location https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz -o nvim.tar.gz
          tar xzf nvim.tar.gz
          git clone https://github.com/tpope/vim-dadbod.git test-data/vim-dadbod
          git -C test-data/vim-dadbod checkout 6d1d41da4873a445c5605f2005ad2c68c99d8770
      - name: Headless Neovim integration
        env:
          DUCKDB_LSP_ROOT: ${{ github.workspace }}
          DADBOD_PATH: ${{ github.workspace }}/test-data/vim-dadbod
        run: ./nvim-linux-x86_64/bin/nvim --headless -u NONE -l tests/integration/neovim.lua
      - name: Completion benchmark
        run: cargo run --locked --release --example benchmark
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-lsp-linux-x86_64
          path: |
            target/release/duckdb-lsp
            workers/requirements*.txt
            editors/neovim/
            THIRD_PARTY.md
            assets/DUCKDB_LICENSE
  ducklake:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ducklake
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: ducklake_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ducklake -d ducklake_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r workers/requirements.txt pytest
      - name: Real DuckLake catalog, snapshots, and read-only access
        env:
          DUCKLAKE_TEST_POSTGRES: host=localhost port=5432 dbname=ducklake_test user=ducklake password=fixture-password
        run: python -m pytest tests/integration/test_ducklake.py -q
