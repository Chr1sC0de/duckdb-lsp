[package]
name = "duckdb-lsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "DuckDB and DuckLake language server for Neovim and other LSP clients"
repository = "https://github.com/Chr1sC0de/duckdb-lsp"

[dependencies]
tower-lsp = "0.20"
tower = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.62"
regex = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
